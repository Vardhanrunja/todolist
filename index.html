
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinTrack — Todo & Expenses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    :root {
      --bg: #0e0f11;
      --surface: #16181c;
      --surface2: #1e2127;
      --surface3: #262a33;
      --border: #2e3340;
      --border2: #3a404f;
      --accent: #6ee7b7;
      --accent2: #38bdf8;
      --accent3: #f472b6;
      --warn: #fbbf24;
      --danger: #f87171;
      --text: #f0f2f5;
      --muted: #7a8396;
      --muted2: #4a5168;
      --radius: 12px;
      --radius-sm: 8px;
    }
 
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
    }
 
    h1, h2, h3, h4 { font-family: 'Syne', sans-serif; }
 
    /* ─── App Shell ─── */
    .app-header {
      padding: 20px 28px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      position: sticky; top: 0; z-index: 50;
    }
    .app-header h1 { font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: -0.3px; }
    .app-header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }
 
    .nav-tabs {
      display: flex;
      gap: 4px;
      padding: 12px 28px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .nav-tab {
      padding: 7px 18px;
      border-radius: var(--radius-sm);
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all .18s;
    }
    .nav-tab.active { background: var(--surface3); color: var(--text); }
    .nav-tab:hover:not(.active) { color: var(--text); background: var(--surface2); }
 
    .main-layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 0;
      min-height: calc(100vh - 112px);
    }
    .main-panel { padding: 24px 28px; border-right: 1px solid var(--border); }
    .side-panel { padding: 20px 20px; background: var(--surface); overflow-y: auto; }
 
    /* ─── Tab Views ─── */
    .tab-view { display: none; }
    .tab-view.active { display: block; }
 
    /* ─── Section Heading ─── */
    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }
 
    /* ─── Input Group ─── */
    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .input-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 140px; }
    .input-group label { font-size: 11px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .6px; }
 
    input[type="text"], input[type="number"], input[type="date"], input[type="time"], textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 9px 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      outline: none;
      transition: border .15s;
    }
    input:focus, textarea:focus { border-color: var(--accent2); }
    input[type="date"]::-webkit-calendar-picker-indicator,
    input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(0.5); cursor: pointer; }
    textarea { resize: vertical; min-height: 70px; }
 
    /* ─── Buttons ─── */
    .btn {
      padding: 9px 18px;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 600;
      transition: all .15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary { background: var(--accent); color: #0a1a13; }
    .btn-primary:hover { background: #5dd4a4; transform: translateY(-1px); }
    .btn-secondary { background: var(--surface3); color: var(--text); border: 1px solid var(--border2); }
    .btn-secondary:hover { background: var(--border); }
    .btn-sm {
      padding: 4px 10px;
      font-size: 11px;
      border-radius: 6px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
    }
    .btn-danger { background: rgba(248,113,113,.1); color: var(--danger); border: 1px solid rgba(248,113,113,.2); }
    .btn-danger:hover { background: rgba(248,113,113,.2); }
 
    /* ─── Todo Items ─── */
    .todo-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 8px;
      overflow: hidden;
      transition: border .15s;
    }
    .todo-item:hover { border-color: var(--border2); }
    .todo-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      cursor: pointer;
    }
    .todo-check {
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 2px solid var(--border2);
      flex-shrink: 0;
      cursor: pointer;
      transition: all .15s;
      display: flex; align-items: center; justify-content: center;
    }
    .todo-check.done { background: var(--accent); border-color: var(--accent); }
    .todo-check.done::after { content: '✓'; font-size: 10px; color: #0a1a13; font-weight: 700; }
    .todo-title { flex: 1; font-weight: 500; font-size: 14px; }
    .todo-title.done { text-decoration: line-through; color: var(--muted); }
    .todo-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 20px;
      background: var(--surface3);
      color: var(--muted);
    }
    .todo-expand-icon { color: var(--muted); font-size: 12px; transition: transform .2s; }
    .todo-item.expanded .todo-expand-icon { transform: rotate(180deg); }
 
    .todo-details {
      display: none;
      padding: 0 16px 14px 46px;
      border-top: 1px solid var(--border);
      margin-top: -1px;
    }
    .todo-item.expanded .todo-details { display: block; padding-top: 12px; }
 
    .detail-row {
      display: flex;
      gap: 20px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .detail-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .detail-chip span { color: var(--text); }
 
    /* ─── Expense Folder System ─── */
    .expense-folder {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 10px;
      overflow: hidden;
      transition: border .15s;
    }
    .expense-folder:hover { border-color: var(--border2); }
 
    .folder-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 16px;
      cursor: pointer;
    }
    .folder-icon { font-size: 18px; flex-shrink: 0; }
    .folder-icon.open { color: var(--warn); }
    .folder-icon.closed { color: var(--muted2); }
    .folder-name { flex: 1; font-weight: 600; font-size: 14px; font-family: 'Syne', sans-serif; }
    .folder-count {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      background: var(--surface3);
      color: var(--muted);
    }
    .folder-total {
      font-weight: 700;
      font-size: 14px;
      color: var(--accent);
      font-family: 'Syne', sans-serif;
    }
    .folder-chevron { color: var(--muted); font-size: 12px; transition: transform .2s; }
    .expense-folder.open .folder-chevron { transform: rotate(180deg); }
 
    .folder-body { display: none; }
    .expense-folder.open .folder-body { display: block; }
 
    .expense-entry {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px 10px 44px;
      border-top: 1px solid var(--border);
    }
    .expense-entry:hover { background: var(--surface2); }
    .entry-info { flex: 1; }
    .entry-date { font-size: 11px; color: var(--muted); }
    .entry-comment { font-size: 12px; color: var(--muted); margin-top: 2px; font-style: italic; }
    .entry-amount { font-weight: 600; font-size: 14px; color: var(--text); font-family: 'Syne', sans-serif; }
 
    /* ─── Side Panel: Monthly Stats ─── */
    .side-panel h3 { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 16px; }
 
    .month-selector {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .month-selector select {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 7px 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      outline: none;
    }
 
    .stat-card {
      background: var(--surface2);
      border-radius: var(--radius-sm);
      padding: 14px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
    }
    .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 6px; }
    .stat-value { font-size: 22px; font-weight: 700; font-family: 'Syne', sans-serif; }
    .stat-value.green { color: var(--accent); }
    .stat-value.blue { color: var(--accent2); }
    .stat-value.pink { color: var(--accent3); }
 
    .month-folder {
      margin-bottom: 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .mfolder-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      cursor: pointer;
    }
    .mfolder-name { flex: 1; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mfolder-total { font-size: 13px; font-weight: 700; color: var(--accent); font-family: 'Syne', sans-serif; }
    .mfolder-chevron { color: var(--muted); font-size: 11px; transition: transform .18s; flex-shrink: 0; }
    .month-folder.open .mfolder-chevron { transform: rotate(180deg); }
    .mfolder-body { display: none; border-top: 1px solid var(--border); }
    .month-folder.open .mfolder-body { display: block; }
    .mfolder-entry {
      display: flex;
      justify-content: space-between;
      padding: 7px 12px;
      font-size: 12px;
      border-bottom: 1px solid var(--border);
    }
    .mfolder-entry:last-child { border-bottom: none; }
    .mfolder-entry-date { color: var(--muted); }
    .mfolder-entry-amt { font-weight: 500; color: var(--text); }
 
    /* ─── Empty State ─── */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 32px; margin-bottom: 10px; opacity: .4; }
    .empty-state p { font-size: 13px; }
 
    /* ─── Toast ─── */
    #toast {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface3);
      border: 1px solid var(--border2);
      color: var(--text);
      padding: 10px 20px;
      border-radius: var(--radius);
      font-size: 13px;
      opacity: 0;
      transition: all .25s;
      z-index: 999;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
 
    /* ─── Responsive ─── */
    @media (max-width: 760px) {
      .main-layout { grid-template-columns: 1fr; }
      .side-panel { border-top: 1px solid var(--border); }
      .main-panel { padding: 16px; }
      .input-row { flex-direction: column; }
    }
 
    .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
  </style>
</head>
<body>
 
<div class="app-header">
  <div class="dot"></div>
  <h1>FinTrack</h1>
</div>
 
<div class="nav-tabs">
  <button class="nav-tab active" onclick="switchTab('todo')">📝 Todo</button>
  <button class="nav-tab" onclick="switchTab('expense')">💰 Expenses</button>
</div>
 
<div class="main-layout">
 
  <!-- ─── MAIN PANEL ─── -->
  <div class="main-panel">
 
    <!-- TODO TAB -->
    <div class="tab-view active" id="tab-todo">
      <p class="section-title">Add Task</p>
      <div class="input-row">
        <div class="input-group" style="flex:2; min-width:200px;">
          <label>Task Name</label>
          <input type="text" id="todo-input" placeholder="What needs to be done?">
        </div>
        <div class="input-group">
          <label>Date</label>
          <input type="date" id="todo-date">
        </div>
        <div class="input-group">
          <label>Time</label>
          <input type="time" id="todo-time">
        </div>
      </div>
      <div class="input-row">
        <div class="input-group" style="flex:2; min-width:200px;">
          <label>Notes (optional)</label>
          <input type="text" id="todo-notes" placeholder="Extra details...">
        </div>
        <div class="input-group" style="flex:0; min-width:0; justify-content:flex-end; padding-top:20px;">
          <button class="btn btn-primary" onclick="addTodo()">＋ Add Task</button>
        </div>
      </div>
 
      <hr class="divider">
      <p class="section-title">Tasks</p>
      <div id="todo-list"></div>
    </div>
 
    <!-- EXPENSE TAB -->
    <div class="tab-view" id="tab-expense">
      <p class="section-title">Add Expense</p>
      <div class="input-row">
        <div class="input-group" style="flex:2; min-width:180px;">
          <label>Merchant / Name</label>
          <input type="text" id="expense-name" placeholder="e.g. Swiggy, Amazon...">
        </div>
        <div class="input-group">
          <label>Amount (₹)</label>
          <input type="number" id="expense-amount" placeholder="0">
        </div>
        <div class="input-group">
          <label>Date</label>
          <input type="date" id="expense-date">
        </div>
      </div>
      <div class="input-row">
        <div class="input-group" style="flex:2; min-width:200px;">
          <label>Note (optional)</label>
          <input type="text" id="expense-comment" placeholder="What was this for?">
        </div>
        <div class="input-group" style="flex:0; min-width:0; justify-content:flex-end; padding-top:20px;">
          <button class="btn btn-primary" onclick="addExpense()">＋ Add</button>
        </div>
      </div>
 
      <hr class="divider">
      <p class="section-title">Expense Folders</p>
      <div id="expense-list"></div>
    </div>
 
  </div>
 
  <!-- ─── SIDE PANEL ─── -->
  <div class="side-panel">
    <h3>📊 Monthly Summary</h3>
 
    <div class="month-selector">
      <select id="month-select" onchange="renderSidePanel()"></select>
    </div>
 
    <div id="side-todo" style="display:none;">
      <div class="stat-card">
        <div class="stat-label">Tasks This Month</div>
        <div class="stat-value blue" id="side-todo-count">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Completed</div>
        <div class="stat-value green" id="side-todo-done">0</div>
      </div>
    </div>
 
    <div id="side-expense-stats" style="display:none;">
      <div class="stat-card">
        <div class="stat-label">Total Spent</div>
        <div class="stat-value green" id="side-total">₹0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Transactions</div>
        <div class="stat-value blue" id="side-count">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Unique Merchants</div>
        <div class="stat-value pink" id="side-merchants">0</div>
      </div>
 
      <hr class="divider" style="margin:14px 0">
      <p class="section-title" style="font-size:11px;">By Merchant</p>
      <div id="side-folder-list"></div>
    </div>
  </div>
 
</div>
 
<div id="toast"></div>
 
<script src="todolist.js"></script>
</body>
</html>
